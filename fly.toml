app = "story-weaver"

[build]
  builder = "paketobuildpacks/builder:base"

[env]
  PYTHON_VERSION = "3.11"
  DEEPSEEK_BASE_URL = "https://api.deepseek.com"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1

[[statics]]
  guest_path = "/app/generative_agents/frontend/static"
  url_prefix = "/static"

[mounts]
  source = "checkpoints"
  destination = "/app/generative_agents/results"

[http_service]
  internal_port = 5001
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true

[[services.ports]]
  handlers = ["http"]
  port = 5001
